; Hazard field ground effect -- radiation, anthrax and poison.
;
; A patch, not a copy. Files here load last, after every subsystem has read its own INI, and
; write only the settings they name onto definitions the game has already built; anything not
; named below keeps whatever the shipped data gave it. That is why this file is a few hundred
; lines where the same change as a loose override was three full copies of vendor files
; totalling 82,064 lines.
;
; Two rules the loader enforces, both so a mistake is loud rather than silent:
;
;   - A block must name something that already exists. A misspelled name is an error here,
;     not a new and half-specified definition that fails much later somewhere else.
;   - Modules go through AddModule / RemoveModule / ReplaceModule. A bare "ClientUpdate ="
;     would append a second module beside the original rather than replace it, so the
;     grammar makes the intent explicit.
;
; What this does: every hazard field used to be a scatter of ground-aligned sprites sharing
; one 128x128 texture, additively blended, so contamination could only ever *brighten* the
; ground it fell on. The fields are now terrain-conforming projected decals that stain, glow,
; grow and animate, driven by HazardFieldDecalClientUpdate (Core/GameEngine/**).
;
; Textures live in the generalsassets repo -- see mod/README.md.

