Object RadiationFieldLarge
  AddModule

    ; TheSuperHackers @tweak What a radiation field leaves on the ground, in three layers.
    ;
    ; Radiation glows where anthrax stains, so the shape is different: a SHADOW_ALPHA_DECAL
    ; scorch that darkens the ground it contaminated, with SHADOW_ADDITIVE_DECAL glow over
    ; it. The glow's hot cores are meant to clear the HDR bloom threshold, which is what
    ; makes them bleed rather than merely look bright.
    ;
    ; Nothing here moves. The mark is a contaminated *place*: it does not turn, spread or
    ; breathe, and the only animation is the glow swelling and ebbing on the spot. Rotation
    ; and breathe are therefore left off, and the layers start at full size rather than
    ; growing into it.
    ;
    ; Declared glow first and scorch last on purpose. The projected-decal manager keeps its
    ; list grouped by texture and puts each newly seen texture at the head, so decal layers
    ; are drawn in the reverse of the order they were created: the layer created last is
    ; drawn first. The scorch is an alpha blend and must go down *under* the additive glow,
    ; or it would paint over the light instead of beneath it.

    ClientUpdate = HazardFieldDecalClientUpdate ModuleTag_09
      Texture = EXRadGlowB
      Style = SHADOW_ADDITIVE_DECAL
      Color = R:252 G:246 B:240
      Radius = 165.0
      StartRadiusFraction = 100%
      GrowthTime = 0
      Opacity = 60%
      FadeInTime = 900
      FadeOutTime = 6000
      Lifetime = 30000
      PulseTime = 1600
      PulseAmount = 85%
      PulsePhase = 30%
    End
    ClientUpdate = HazardFieldDecalClientUpdate ModuleTag_10
      Texture = EXRadGlowA
      Style = SHADOW_ADDITIVE_DECAL
      Color = R:252 G:246 B:240
      Radius = 200.0
      StartRadiusFraction = 100%
      GrowthTime = 0
      Opacity = 85%
      FadeInTime = 600
      FadeOutTime = 6000
      Lifetime = 30000
      PulseTime = 2400
      PulseAmount = 70%
      PulsePhase = 0%
    End
    ClientUpdate = HazardFieldDecalClientUpdate ModuleTag_11
      Texture = EXRadScorch
      Style = SHADOW_ALPHA_DECAL
      Color = R:252 G:246 B:240
      Radius = 230.0
      StartRadiusFraction = 100%
      GrowthTime = 0
      Opacity = 78%
      FadeInTime = 400
      FadeOutTime = 7000
      Lifetime = 30000
    End
  End
End

