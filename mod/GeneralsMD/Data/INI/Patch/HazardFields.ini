; ------------------------------------------------------------------------------------------
; The old sprite emitters.
;
; BurstCount = 0 is a clean disable rather than a deletion: the burst loop is
; for (i < count), so nothing is created and no per-particle cost remains, and the systems
; stay defined for anything else that references them by name.
;
; AnthraxField* is the exception -- it is retuned rather than switched off, because the decals
; stain the ground but the drifting ground mist above it is still wanted.
; ------------------------------------------------------------------------------------------

