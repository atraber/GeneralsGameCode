; MilitiaTank tread animation -- the model already has working tread meshes and a
; LinearOffset mapper (CVTank / CVTank_D, TREADSL01 / TREADSR01), but the draw module never
; set TreadAnimationRate, so W3DTankDraw::updateTreadObjects never registers them and the
; treads stay static. See the tread animation census for the full census.
;
; TreadAnimationRate is draw-module data, not an object field, so the finest patch grain is
; the whole module -- ReplaceModule, restating the block with the one line added. The tag
; after ReplaceModule names the module being removed (ModuleTag_01, the tag CivilianUnit.ini
; gives this Draw module); the replacement module then needs its own new, unique tag.
;
; 2.0 matches the shipped rate on 52 other objects, including CINE_ChinaTankBattleMaster --
; the closest comparable case, since it is the one Battlemaster object whose treads already
; scroll today.

Object MilitiaTank
  ReplaceModule ModuleTag_01
    Draw = W3DTankDraw ModuleTag_01_Treads
      DefaultConditionState
        Model               = CVTank
        Turret              = Turret01
        WeaponFireFXBone    = PRIMARY MuzzleFX
        WeaponRecoilBone    = PRIMARY Barrel
        WeaponMuzzleFlash   = PRIMARY MuzzleFX
        WeaponLaunchBone    = PRIMARY MuzzleFX
      End
      ConditionState       = REALLYDAMAGED
        Model              = CVTank_D
      End
      ConditionState       = RUBBLE
        Model              = CVTank_D
      End

      TrackMarks           = EXTnkTrack.tga
      OkToChangeModelColor = Yes
      TreadAnimationRate   = 2.0
    End
  End
End

; The three Battlemaster objects, once the HD_China_Battlemaster_Mod art gave NVBtMstr and
; NVBtMstrNG working TREADSL01/L02/R01/R02 meshes (verified: LinearOffset mapper on each,
; correctly sided) but never got a TreadAnimationRate to go with them. Same fix as
; MilitiaTank above, once per object -- ChinaTankBattleMaster and Tank_ChinaTankBattleMaster
; both draw NVBtMstr; Nuke_ChinaTankBattleMaster draws NVBtMstrNG. 2.0 matches the rate
; already shipped on CINE_ChinaTankBattleMaster, the one Battlemaster whose treads already
; scroll today.

Object ChinaTankBattleMaster
